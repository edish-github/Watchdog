# Every 10 minutes: advance the live workspace and retry its FHIR outbox. Vercel Cron (vercel.json) runs the daily jobs.
# Set repository secrets WATCHDOG_URL (e.g. https://watchdog.example.app) and CRON_SECRET; until then this skips.
name: scheduled jobs
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: cycle + outbox
        env:
          WATCHDOG_URL: ${{ secrets.WATCHDOG_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$WATCHDOG_URL" ] || [ -z "$CRON_SECRET" ]; then echo "WATCHDOG_URL / CRON_SECRET not set; skipping."; exit 0; fi
          for job in cycle outbox; do curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$WATCHDOG_URL/api/cron/$job"; echo; done
